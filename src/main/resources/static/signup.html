<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlaceAI | Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            color: #172033;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 17px;
            font-size: 14px;
            line-height: 1.5;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .login a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        PlaceAI
    </div>

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Start your placement preparation
        </p>

        <form id="signupForm">

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                minlength="6"
                required
            >

            <button type="submit" id="signupBtn">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <div class="login">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="home">
            ← Back to Home
        </a>

    </div>

</div>

<script>

const form = document.getElementById("signupForm");
const button = document.getElementById("signupBtn");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const fullName =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    message.innerText = "Creating account...";
    message.style.color = "#6b7280";

    button.disabled = true;

    try {

        const response = await fetch("/api/users/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                fullName: fullName,

                email: email,

                password: password,

                role: "USER"

            })

        });

        const text = await response.text();

        let data = {};

        try {
            data = JSON.parse(text);
        } catch {
            data = {
                message: text
            };
        }

        if (response.ok) {

            message.style.color = "green";

            message.innerText =
                "Account created successfully! Redirecting...";

            setTimeout(function() {

                window.location.href = "login.html";

            }, 1000);

        } else {

            message.style.color = "red";

            message.innerText =
                data.message ||
                "Registration failed.";

            button.disabled = false;
        }

    } catch (error) {

        console.error("Registration error:", error);

        message.style.color = "red";

        message.innerText =
            "Unable to connect to server.";

        button.disabled = false;
    }

});

</script>

</body>
</html>
