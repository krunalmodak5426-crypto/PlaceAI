<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PlaceAI | Aptitude</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            color: #172033;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;
        }

        .logo {
            color: #2563eb;
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            text-decoration: none;
            color: #374151;
            font-size: 14px;
        }

        .back:hover {
            color: #2563eb;
        }

        /* ================= MAIN ================= */

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6b7280;
        }

        /* ================= FILTERS ================= */

        .top {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: white;
            font-size: 14px;
            color: #172033;
        }

        /* ================= QUESTION CARD ================= */

        .question-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 30px;
        }

        .question-number {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question {
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            width: 100%;
            padding: 15px;
            text-align: left;

            background: white;
            color: #172033;

            border: 1px solid #d1d5db;
            border-radius: 8px;

            cursor: pointer;
            font-size: 15px;
        }

        .option:hover {
            border-color: #2563eb;
            background: #f8faff;
        }

        .option.selected {
            border-color: #2563eb;
            background: #eff6ff;
            color: #172033;
        }

        .option.correct {
            border-color: #16a34a;
            background: #f0fdf4;
            color: #166534;
        }

        .option.wrong {
            border-color: #dc2626;
            background: #fef2f2;
            color: #b91c1c;
        }

        .option:disabled {
            opacity: 1;
            cursor: default;
        }

        /* ================= ANSWER FEEDBACK ================= */

        #answerFeedback {
            display: none;

            margin-top: 18px;
            padding: 16px;

            background: #f8fafc;

            border: 1px solid #e5e7eb;
            border-radius: 8px;

            line-height: 1.6;
        }

        #answerFeedback .answer-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        #answerFeedback .answer-correct {
            color: #16a34a;
            font-weight: bold;
        }

        #answerFeedback .answer-solution {
            margin-top: 10px;
            color: #4b5563;
        }

        /* ================= BOTTOM ================= */

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .score {
            color: #6b7280;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;

            padding: 11px 20px;
            border-radius: 7px;

            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* ================= ERROR ================= */

        #errorMessage {
            display: none;

            background: #fef2f2;
            color: #b91c1c;

            border: 1px solid #fecaca;
            border-radius: 8px;

            padding: 15px;
            margin-bottom: 20px;
        }

        /* ================= RESULT ================= */

        #result {
            display: none;

            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;

            padding: 40px;
            text-align: center;
        }

        #result h2 {
            margin-bottom: 15px;
        }

        #result p {
            color: #6b7280;
            margin-bottom: 20px;
            font-size: 18px;
        }

        /* ================= RESULT DETAILS ================= */

        #resultDetails {
            margin-top: 30px;
            text-align: left;
        }

        .result-item {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .result-question {
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .result-line {
            margin: 8px 0;
            color: #4b5563;
        }

        .correct-text {
            color: #16a34a;
            font-weight: bold;
        }

        .wrong-text {
            color: #dc2626;
            font-weight: bold;
        }

        .solution {
            margin-top: 12px;
            padding: 14px;

            background: white;

            border-radius: 8px;
            border: 1px solid #e5e7eb;

            line-height: 1.5;
        }

        /* ================= POPUP ================= */

        #scoreModal {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0, 0, 0, 0.55);

            align-items: center;
            justify-content: center;

            z-index: 9999;
        }

        .score-popup {
            width: 90%;
            max-width: 430px;

            background: white;
            border-radius: 16px;
            padding: 35px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .score-popup h2 {
            margin-bottom: 12px;
        }

        .popup-score {
            font-size: 44px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        .popup-stats {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }

        .popup-stat {
            font-weight: bold;
        }

        .popup-message {
            color: #64748b;
            margin-bottom: 25px;
        }

        .popup-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .top {
                flex-direction: column;
            }

            .question-card {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .bottom {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .popup-buttons {
                flex-direction: column;
            }

            .popup-stats {
                gap: 15px;
            }

        }

    </style>

</head>


<body>


<!-- ================= LOGIN CHECK ================= -->

<script>

    const isLoggedIn =
        localStorage.getItem("isLoggedIn");

    const placeaiUser =
        localStorage.getItem("placeaiUser");

    if (
        isLoggedIn !== "true" ||
        !placeaiUser
    ) {

        window.location.href = "/login.html";

    }

</script>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        PlaceAI
    </div>

    <a href="/dashboard.html"
       class="back">
        ← Dashboard
    </a>

</nav>


<!-- ================= MAIN ================= -->

<main class="container">


    <div class="header">

        <h1>
            Aptitude Practice
        </h1>

        <p>
            Test your quantitative and logical reasoning skills.
        </p>

    </div>


    <!-- ================= FILTERS ================= -->

    <div class="top">

        <select id="category">

            <option value="all">
                All Topics
            </option>

            <option value="quantitative">
                Quantitative Aptitude
            </option>

            <option value="logical">
                Logical Reasoning
            </option>

            <option value="verbal">
                Verbal Ability
            </option>

            <option value="grammar">
                Grammar
            </option>

            <option value="technical">
                Technical
            </option>

        </select>


        <select id="difficulty">

            <option value="all">
                All Difficulties
            </option>

            <option value="easy">
                Easy
            </option>

            <option value="medium" selected>
                Medium
            </option>

            <option value="hard">
                Hard
            </option>

        </select>

    </div>


    <!-- ================= ERROR ================= -->

    <div id="errorMessage">
        Unable to load questions from server.
    </div>


    <!-- ================= QUIZ ================= -->

    <div id="quiz">

        <div class="question-card">

            <div class="question-number"
                 id="questionNumber">
                Loading...
            </div>

            <div class="question"
                 id="question">
                Loading question...
            </div>

            <div class="options"
                 id="options">
            </div>

            <!-- ANSWER + SOLUTION WILL APPEAR HERE -->

            <div id="answerFeedback">
            </div>

            <div class="bottom">

                <span class="score"
                      id="score">
                    Answered: 0
                </span>

                <button id="nextBtn"
                        disabled>
                    Next Question
                </button>

            </div>

        </div>

    </div>


    <!-- ================= RESULT ================= -->

    <div id="result">

        <h2>
            🎉 Aptitude Test Completed
        </h2>

        <p id="finalScore">
        </p>

        <div id="resultDetails">
        </div>

        <button onclick="location.reload()">
            Try Again
        </button>

    </div>

</main>


<!-- ================= SCORE POPUP ================= -->

<div id="scoreModal">

    <div class="score-popup">

        <h2>
            🎉 Test Completed
        </h2>

        <div class="popup-score"
             id="popupScore">
            0%
        </div>

        <div class="popup-stats">

            <div class="popup-stat">

                ✅ Correct:

                <span id="correctCount">
                    0
                </span>

            </div>

            <div class="popup-stat">

                ❌ Wrong:

                <span id="wrongCount">
                    0
                </span>

            </div>

        </div>

        <p class="popup-message"
           id="popupMessage">
            Test evaluation completed.
        </p>

        <div class="popup-buttons">

            <button onclick="viewDetailedResult()">
                View Result
            </button>

        </div>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>


/* ==================================================
   VARIABLES
   ================================================== */

let allQuestions = [];

let questions = [];

let currentQuestion = 0;

let answeredCount = 0;

let correctCount = 0;

let wrongCount = 0;

let quizResults = [];


/* ==================================================
   ELEMENTS
   ================================================== */

const category =
    document.getElementById("category");


const difficulty =
    document.getElementById("difficulty");


const questionNumber =
    document.getElementById("questionNumber");


const question =
    document.getElementById("question");


const options =
    document.getElementById("options");


const nextBtn =
    document.getElementById("nextBtn");


const scoreElement =
    document.getElementById("score");


const answerFeedback =
    document.getElementById("answerFeedback");


const errorMessage =
    document.getElementById("errorMessage");


const scoreModal =
    document.getElementById("scoreModal");


const popupScore =
    document.getElementById("popupScore");


const popupMessage =
    document.getElementById("popupMessage");


const correctCountElement =
    document.getElementById("correctCount");


const wrongCountElement =
    document.getElementById("wrongCount");


const resultDetailsContainer =
    document.getElementById("resultDetails");


/* ==================================================
   LOAD QUESTIONS
   ================================================== */

async function loadQuestions() {

    questionNumber.innerText =
        "Loading...";


    question.innerText =
        "Loading questions from server...";


    options.innerHTML =
        "";


    nextBtn.disabled =
        true;


    errorMessage.style.display =
        "none";


    try {

        const response =
            await fetch(
                "/api/awt/questions/student"
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Questions received:",
            data
        );


        allQuestions =
            data.map(function(q) {

                return {

                    id:
                        q.id,

                    question:
                        q.question,

                    optionA:
                        q.optionA,

                    optionB:
                        q.optionB,

                    optionC:
                        q.optionC,

                    optionD:
                        q.optionD,

                    topic:
                        q.topic,

                    difficulty:
                        q.difficulty

                };

            });


        applyFilters();

    }


    catch (error) {

        console.error(
            "APTITUDE API ERROR:",
            error
        );


        errorMessage.style.display =
            "block";


        questionNumber.innerText =
            "Questions unavailable";


        question.innerText =
            "Unable to load questions from server.";


        options.innerHTML =
            "";

    }

}


/* ==================================================
   FILTER QUESTIONS
   ================================================== */

function applyFilters() {

    const selectedCategory =
        category.value.toLowerCase();


    const selectedDifficulty =
        difficulty.value.toLowerCase();


    questions =
        allQuestions.filter(
            function(q) {

                const topic =
                    (q.topic || "")
                        .toLowerCase();


                const level =
                    (q.difficulty || "")
                        .toLowerCase();


                let topicMatch =
                    true;


                let difficultyMatch =
                    true;


                if (
                    selectedCategory !==
                    "all"
                ) {

                    topicMatch =
                        topic.includes(
                            selectedCategory
                        );

                }


                if (
                    selectedDifficulty !==
                    "all"
                ) {

                    difficultyMatch =
                        level ===
                        selectedDifficulty;

                }


                return (
                    topicMatch &&
                    difficultyMatch
                );

            }
        );


    currentQuestion =
        0;


    answeredCount =
        0;


    correctCount =
        0;


    wrongCount =
        0;


    quizResults =
        [];


    scoreElement.innerText =
        "Answered: 0";


    if (questions.length === 0) {

        questionNumber.innerText =
            "No questions found";


        question.innerText =
            "No questions are available for this selection.";


        options.innerHTML =
            "";


        answerFeedback.style.display =
            "none";


        answerFeedback.innerHTML =
            "";


        nextBtn.disabled =
            true;


        return;

    }


    loadQuestion();

}


/* ==================================================
   LOAD QUESTION
   ================================================== */

function loadQuestion() {

    const q =
        questions[currentQuestion];


    questionNumber.innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    question.innerText =
        q.question;


    options.innerHTML =
        "";


    /* CLEAR PREVIOUS ANSWER */

    answerFeedback.style.display =
        "none";


    answerFeedback.innerHTML =
        "";


    nextBtn.disabled =
        true;


    nextBtn.innerText =
        "Next Question";


    const questionOptions = [

        q.optionA,

        q.optionB,

        q.optionC,

        q.optionD

    ];


    questionOptions.forEach(
        function(option, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.innerText =
                option;


            button.addEventListener(
                "click",
                function() {

                    selectAnswer(
                        button,
                        index
                    );

                }
            );


            options.appendChild(
                button
            );

        }
    );

}


/* ==================================================
   CHECK ANSWER + SAVE ATTEMPT
   ================================================== */

async function selectAnswer(
    button,
    index
) {

    const allOptions =
        document.querySelectorAll(
            ".option"
        );


    allOptions.forEach(
        function(option) {

            option.disabled =
                true;

        }
    );


    button.classList.add(
        "selected"
    );


    nextBtn.disabled =
        true;


    const current =
        questions[currentQuestion];


    const questionOptions = [

        current.optionA,

        current.optionB,

        current.optionC,

        current.optionD

    ];


    const selectedAnswer =
        questionOptions[index];


    try {

        /* ================= CHECK ANSWER ================= */

        const response =
            await fetch(
                "/api/awt/questions/check",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            questionId:
                                current.id,

                            answer:
                                selectedAnswer

                        })

                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                errorText
            );

        }


        const result =
            await response.json();


        console.log(
            "Answer result:",
            result
        );


        /* ==================================================
           SHOW ANSWER + SOLUTION BELOW OPTIONS
           ================================================== */

        const correctAnswerText =
            result.correctAnswer ||
            "Not available";


        const solutionText =
            result.solution ||
            "Solution not available yet.";


        answerFeedback.innerHTML = `

            <div class="answer-title">

                ${
                    result.correct
                    ? "✅ Correct Answer"
                    : "❌ Correct Answer"
                }

            </div>

            <div>

                Correct answer:

                <span class="answer-correct">

                    ${escapeHTML(
                        correctAnswerText
                    )}

                </span>

            </div>

            <div class="answer-solution">

                <strong>
                    Solution:
                </strong>

                <br>

                ${escapeHTML(
                    solutionText
                )}

            </div>

        `;


        answerFeedback.style.display =
            "block";


        /* ================= CORRECT ================= */

        if (result.correct) {

            button.classList.remove(
                "selected"
            );


            button.classList.add(
                "correct"
            );


            correctCount++;

        }


        /* ================= WRONG ================= */

        else {

            button.classList.remove(
                "selected"
            );


            button.classList.add(
                "wrong"
            );


            wrongCount++;


            const correctIndex =
                questionOptions.findIndex(
                    function(option) {

                        return (
                            option ===
                            result.correctAnswer
                        );

                    }
                );


            if (correctIndex !== -1) {

                allOptions[correctIndex]
                    .classList.add(
                        "correct"
                    );

            }

        }


        /* ==================================================
           SAVE ATTEMPT TO DATABASE
           ================================================== */

        try {

            const userData =
                localStorage.getItem(
                    "placeaiUser"
                );


            if (userData) {

                const user =
                    JSON.parse(
                        userData
                    );


                const saveResponse =
                    await fetch(
                        "/api/user-attempts",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    email:
                                        user.email,

                                    type:
                                        "APTITUDE",

                                    itemId:
                                        current.id,

                                    status:
                                        result.correct
                                        ? "CORRECT"
                                        : "WRONG"

                                })

                        }
                    );


                if (!saveResponse.ok) {

                    const saveError =
                        await saveResponse.text();


                    console.error(
                        "ATTEMPT SAVE FAILED:",
                        saveError
                    );

                }

                else {

                    console.log(
                        "APTITUDE ATTEMPT SAVED"
                    );

                }

            }

        }


        catch (saveError) {

            console.error(
                "ATTEMPT SAVE ERROR:",
                saveError
            );

        }


        /* ================= UPDATE COUNT ================= */

        answeredCount++;


        scoreElement.innerText =
            "Answered: " +
            answeredCount;


        /* ================= SAVE RESULT ================= */

        quizResults.push({

            question:
                current.question,

            selectedAnswer:
                result.selectedAnswer ||
                selectedAnswer,

            correctAnswer:
                result.correctAnswer,

            correct:
                result.correct,

            solution:
                result.solution

        });


        /* ================= NEXT ================= */

        nextBtn.disabled =
            false;


        if (
            currentQuestion ===
            questions.length - 1
        ) {

            nextBtn.innerText =
                "Finish Test";

        }

    }


    catch (error) {

        console.error(
            "ANSWER CHECK ERROR:",
            error
        );


        alert(
            "Unable to check this answer.\n\n" +
            error.message
        );


        allOptions.forEach(
            function(option) {

                option.disabled =
                    false;

            }
        );


        button.classList.remove(
            "selected"
        );


        answerFeedback.style.display =
            "none";


        answerFeedback.innerHTML =
            "";


        nextBtn.disabled =
            true;

    }

}


/* ==================================================
   NEXT QUESTION
   ================================================== */

nextBtn.addEventListener(
    "click",
    function() {

        currentQuestion++;


        if (
            currentQuestion <
            questions.length
        ) {

            loadQuestion();

        }

        else {

            finishQuiz();

        }

    }
);


/* ==================================================
   FINISH QUIZ
   ================================================== */

function finishQuiz() {

    document.getElementById(
        "quiz"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).style.display =
        "block";


    const total =
        questions.length;


    const percentage =
        total > 0
        ? Math.round(
            (
                correctCount /
                total
            ) * 100
        )
        : 0;


    /* ================= FINAL RESULT ================= */

    document.getElementById(
        "finalScore"
    ).innerText =
        "Your score is " +
        correctCount +
        " out of " +
        total +
        " (" +
        percentage +
        "%).";


    /* ================= POPUP ================= */

    popupScore.innerText =
        percentage + "%";


    correctCountElement.innerText =
        correctCount;


    wrongCountElement.innerText =
        wrongCount;


    popupMessage.innerText =
        "Correct: " +
        correctCount +
        " | Wrong: " +
        wrongCount;


    buildDetailedResults();


    scoreModal.style.display =
        "flex";

}


/* ==================================================
   BUILD DETAILED RESULTS
   ================================================== */

function buildDetailedResults() {

    resultDetailsContainer.innerHTML =
        "";


    quizResults.forEach(
        function(item, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "result-item";


            let statusHTML;


            if (item.correct) {

                statusHTML =
                    '<span class="correct-text">' +
                    '✅ Correct' +
                    '</span>';

            }

            else {

                statusHTML =
                    '<span class="wrong-text">' +
                    '❌ Wrong' +
                    '</span>';

            }


            const solutionText =
                item.solution
                ? item.solution
                : "Solution not available yet.";


            div.innerHTML = `

                <div class="result-question">

                    ${index + 1}.
                    ${escapeHTML(
                        item.question
                    )}

                </div>


                <div class="result-line">

                    Your answer:

                    <strong>

                        ${escapeHTML(
                            item.selectedAnswer ||
                            ""
                        )}

                    </strong>

                </div>


                <div class="result-line">

                    Correct answer:

                    <strong>

                        ${escapeHTML(
                            item.correctAnswer ||
                            ""
                        )}

                    </strong>

                </div>


                <div class="result-line">

                    ${statusHTML}

                </div>


                <div class="solution">

                    <strong>
                        Solution:
                    </strong>

                    <br>

                    ${escapeHTML(
                        solutionText
                    )}

                </div>

            `;


            resultDetailsContainer.appendChild(
                div
            );

        }
    );

}


/* ==================================================
   SAFE HTML DISPLAY
   ================================================== */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
